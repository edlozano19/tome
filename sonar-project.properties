sonar.organization=edlozano19
sonar.projectKey=edlozano19_tome

sonar.projectName=Tome

# Source code to analyze
sonar.sources=backend/src/main,frontend/src

# Test code
sonar.tests=backend/src/test

# Stay out of build artifacts and dependencies
sonar.exclusions=**/node_modules/**,**/dist/**,**/target/**,**/.mvn/**

# Encoding
sonar.sourceEncoding=UTF-8

# Coverage not enforced yet — exclude all app sources so new packages
# don't need per-folder updates. Tighten later when JaCoCo is wired
# and you want a real coverage gate (drop backend/src/main/** then).
sonar.coverage.exclusions=backend/src/main/**,frontend/src/**
